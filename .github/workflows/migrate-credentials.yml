name: Migrate certificates and awards into profile
on:
  push:
    paths:
      - '.github/workflows/migrate-credentials.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy original binary files and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/denoskume/certifications-and-awards.git /tmp/credentials-source
          mkdir -p credentials
          cp -a /tmp/credentials-source/assets /tmp/credentials-source/awards /tmp/credentials-source/experience credentials/
          cp /tmp/credentials-source/README.md credentials/README.md
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          src = Path('/tmp/credentials-source')
          dest = Path('credentials')
          source_files = sorted(p for p in src.rglob('*') if p.is_file() and '.git' not in p.parts)
          for original in source_files:
              relative = original.relative_to(src)
              copied = dest / relative
              assert copied.is_file(), f'Missing: {relative}'
              assert original.read_bytes() == copied.read_bytes(), f'Changed bytes: {relative}'
          readme = Path('README.md')
          text = readme.read_text()
          old = 'https://github.com/denoskume/certifications-and-awards/blob/main/awards/Fire_Fighting_Robot_GALAXIA_3rd_Place_2022.png'
          assert old in text
          text = text.replace(old, 'credentials/awards/Fire_Fighting_Robot_GALAXIA_3rd_Place_2022.png')
          old_archive = 'https://github.com/denoskume/certifications-and-awards'
          assert old_archive in text
          text = text.replace(old_archive, 'credentials/README.md')
          readme.write_text(text)
          print(f'Verified {len(source_files)} source files byte-for-byte')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add credentials README.md
          git diff --cached --check
          git commit -m "Consolidate certificates, awards and experience into profile"
          git push
