name: Finalize real project cards

on:
  push:
    paths:
      - '.github/workflows/build-real-project-cards.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/finalize_project_cards.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/build-real-project-cards.yml scripts/finalize_project_cards.py
          git add README.md
          git commit -m "Match real project cards to profile style"
          git push
