name: Rebuild credential cards

on:
  push:
    paths:
      - '.github/workflows/rebuild-credential-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained credential cards
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/denoskume/certifications-and-awards/main/awards/SimpliLearn_Data_Science_Certificate.png \
            -o /tmp/simplilearn.png
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/denoskume/certifications-and-awards/main/awards/Google_Advance_DA_Certificate.png \
            -o /tmp/google.png

          SIMPLI_B64=$(base64 -w0 /tmp/simplilearn.png)
          GOOGLE_B64=$(base64 -w0 /tmp/google.png)

          cat > assets/credential-simplilearn-square.svg <<EOF
          <svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="preview"><rect x="18" y="112" width="324" height="178" rx="12"/></clipPath></defs>
            <rect x="1" y="1" width="358" height="358" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
            <text x="24" y="42" fill="#667085" font-family="Segoe UI,Arial" font-size="13" font-weight="700">CERTIFICATE · SIMPLILEARN</text>
            <text x="24" y="92" fill="#101828" font-family="Segoe UI,Arial" font-size="26" font-weight="700">Data Scientist</text>
            <rect x="18" y="112" width="324" height="178" rx="12" fill="#F8FAFC" stroke="#E4E7EC"/>
            <image x="18" y="112" width="324" height="178" preserveAspectRatio="xMidYMid meet" clip-path="url(#preview)" href="data:image/png;base64,${SIMPLI_B64}"/>
            <text x="180" y="320" text-anchor="middle" fill="#344054" font-family="Segoe UI,Arial" font-size="14">Simplilearn Masters Program</text>
            <text x="180" y="344" text-anchor="middle" fill="#667085" font-family="Segoe UI,Arial" font-size="13">Professional certificate</text>
          </svg>
          EOF

          cat > assets/credential-google-analytics-square.svg <<EOF
          <svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="preview"><rect x="18" y="112" width="324" height="178" rx="12"/></clipPath></defs>
            <rect x="1" y="1" width="358" height="358" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
            <text x="24" y="42" fill="#667085" font-family="Segoe UI,Arial" font-size="13" font-weight="700">CERTIFICATE · GOOGLE</text>
            <text x="24" y="92" fill="#101828" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Advanced Data Analytics</text>
            <rect x="18" y="112" width="324" height="178" rx="12" fill="#F8FAFC" stroke="#E4E7EC"/>
            <image x="18" y="112" width="324" height="178" preserveAspectRatio="xMidYMid meet" clip-path="url(#preview)" href="data:image/png;base64,${GOOGLE_B64}"/>
            <text x="180" y="320" text-anchor="middle" fill="#344054" font-family="Segoe UI,Arial" font-size="14">Google Professional Certificate</text>
            <text x="180" y="344" text-anchor="middle" fill="#667085" font-family="Segoe UI,Arial" font-size="13">Career certificate</text>
          </svg>
          EOF

      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/credential-simplilearn-square.svg assets/credential-google-analytics-square.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Embed certificate images in credential cards"
          git push
