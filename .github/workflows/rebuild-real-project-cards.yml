name: Rebuild real project cards

on:
  push:
    paths:
      - '.github/workflows/rebuild-real-project-cards.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build matching project cards from real previews
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/denoskume/Python-CardGame/main/docs/cardgame_demo.gif \
            -o /tmp/cardgame.gif
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/denoskume/monstage/main/docs/assets/monstage_preview_sanitized.png \
            -o /tmp/monstage.png

          python - <<'PY'
          from PIL import Image
          img = Image.open('/tmp/cardgame.gif')
          img.seek(min(8, getattr(img, 'n_frames', 1)-1))
          img.convert('RGB').save('/tmp/cardgame.png')
          PY

          CARD_B64=$(base64 -w0 /tmp/cardgame.png)
          MON_B64=$(base64 -w0 /tmp/monstage.png)

          cat > assets/project-cardgame-square.svg <<EOF
          <svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="preview"><rect x="18" y="118" width="324" height="122" rx="12"/></clipPath></defs>
            <rect x="1" y="1" width="358" height="358" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
            <text x="24" y="42" fill="#667085" font-family="Segoe UI,Arial" font-size="13" font-weight="700">PYTHON SOFTWARE ENGINEERING</text>
            <text x="24" y="92" fill="#101828" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Python CardGame</text>
            <rect x="18" y="118" width="324" height="122" rx="12" fill="#F8FAFC" stroke="#E4E7EC"/>
            <image x="18" y="118" width="324" height="122" preserveAspectRatio="xMidYMid meet" clip-path="url(#preview)" href="data:image/png;base64,${CARD_B64}"/>
            <text x="24" y="272" fill="#344054" font-family="Segoe UI,Arial" font-size="13">Event-driven three-card tracking game</text>
            <text x="24" y="308" fill="#667085" font-family="Segoe UI,Arial" font-size="12">Pygame · finite-state machine · modular architecture</text>
            <text x="24" y="334" fill="#667085" font-family="Segoe UI,Arial" font-size="12">JSON persistence · timed states</text>
          </svg>
          EOF

          cat > assets/project-monstage-square.svg <<EOF
          <svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="preview"><rect x="18" y="118" width="324" height="122" rx="12"/></clipPath></defs>
            <rect x="1" y="1" width="358" height="358" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
            <text x="24" y="42" fill="#667085" font-family="Segoe UI,Arial" font-size="13" font-weight="700">FULL-STACK PRODUCT · AUTOMATION</text>
            <text x="24" y="92" fill="#101828" font-family="Segoe UI,Arial" font-size="24" font-weight="700">MonStage</text>
            <rect x="18" y="118" width="324" height="122" rx="12" fill="#F8FAFC" stroke="#E4E7EC"/>
            <image x="18" y="118" width="324" height="122" preserveAspectRatio="xMidYMid meet" clip-path="url(#preview)" href="data:image/png;base64,${MON_B64}"/>
            <text x="24" y="268" fill="#344054" font-family="Segoe UI,Arial" font-size="13">Internship discovery, prioritization</text>
            <text x="24" y="287" fill="#344054" font-family="Segoe UI,Arial" font-size="13">&amp; application tracking</text>
            <text x="24" y="316" fill="#667085" font-family="Segoe UI,Arial" font-size="12">React · TypeScript · authentication</text>
            <text x="24" y="340" fill="#667085" font-family="Segoe UI,Arial" font-size="12">Cloudflare Worker · Apps Script · responsive UI</text>
          </svg>
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          start = text.index('<table align="center" border="1" cellspacing="0" cellpadding="14">')
          end = text.index('</table>', start) + len('</table>')
          replacement = '''<p align="center">
            <a href="https://github.com/denoskume/Python-CardGame"><img src="assets/project-cardgame-square.svg?v=3" width="340" height="340" alt="Python CardGame" /></a>
            &nbsp;&nbsp;
            <a href="https://github.com/denoskume/monstage"><img src="assets/project-monstage-square.svg?v=3" width="340" height="340" alt="MonStage" /></a>
          </p>'''
          p.write_text(text[:start] + replacement + text[end:])
          PY

          rm .github/workflows/rebuild-real-project-cards.yml

      - name: Commit final project cards
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Match project card borders with real previews"
          git push
