<text x="155" y="191" text-anchor="middle" fill="#0F5C86" font-family="Segoe UI,Arial" font-size="23" font-weight="700">Audio Classification</text>
<text x="30" y="232" fill="#174E70" font-family="Segoe UI,Arial" font-size="13.5">
<tspan x="30" dy="0">Zero-shot ESC-50 classification with LAION-CLAP</tspan>
<tspan x="30" dy="21">and ten natural-language prompt strategies.</tspan>
<tspan x="30" dy="21">No ESC-50 training or task-specific fine-tuning</tspan>
<tspan x="30" dy="21">is used in the experiment.</tspan>
<tspan x="30" dy="31">The best prompt reaches 91.15% Top-1 and</tspan>
<tspan x="30" dy="21">99.00% Top-5 accuracy — an 8.10 pp gain</tspan>
<tspan x="30" dy="21">over the class-only prompt baseline.</tspan>
</text>
